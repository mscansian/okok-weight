[project]
name = "scale-server"
version = "0.1.0"
description = "Receives weigh-ins from the scale gateway and stores them."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
scale-server = "scale_server.main:run"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scale_server"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
